apiVersion: apps/v1
kind: Deployment
metadata:
  name: sched-builder
spec:
  replicas: 5
  selector:
    matchLabels:
      app: web-site
  template:
    metadata:
      labels:
        app: web-site
    spec:
      containers:
      - name: web-container
        image: jjtschooldlsud/sched-builder:v2.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80