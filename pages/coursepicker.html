<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Picker</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-brand">
      <span class="brand-icon">📚</span>
      <span>MAIN</span>
    </div>

    <nav class="app-nav">
      <button class="nav-button" onclick="window.location.href='home.html'">Home</button>
      <button class="nav-button" onclick="window.location.href='coursepicker.html'">Course Picker</button>
      <button class="nav-button" onclick="window.location.href='subjectschedule.html'">Schedule Picker</button>
      <button class="nav-button" onclick="window.location.href='scheduleplotter.html'">Schedule Plotter</button>
    </nav>

    <button class="profile-button" aria-label="Open profile">👤</button>
  </header>

  <main class="page-content">
    <div class="page-title">
      <h1>Course Picker</h1>
      <p>Select courses and build your term schedule.</p>
    </div>

    <section class="page-panel">
      <h2>Available Courses</h2>
      <p>Select your course track below:</p>
      
      <div class="course-selection">
        <label class="course-checkbox">
          <input type="radio" name="course-picker" id="cs-course" value="computer-science">
          <span>Computer Science</span>
        </label>
        
        <label class="course-checkbox">
          <input type="radio" name="course-picker" id="it-course" value="it">
          <span>IT</span>
        </label>
      </div>

      <h2>Select Year</h2>
      <p>Choose your academic year:</p>

      <div class="course-selection">
        <label class="course-checkbox">
          <input type="radio" name="year-picker" id="year-1" value="1">
          <span>1st Year</span>
        </label>
        
        <label class="course-checkbox">
          <input type="radio" name="year-picker" id="year-2" value="2">
          <span>2nd Year</span>
        </label>

        <label class="course-checkbox">
          <input type="radio" name="year-picker" id="year-3" value="3">
          <span>3rd Year</span>
        </label>

        <label class="course-checkbox">
          <input type="radio" name="year-picker" id="year-4" value="4">
          <span>4th Year</span>
        </label>
      </div>

      <h2>Select Semester</h2>
      <p>Choose your semester:</p>

      <div class="course-selection">
        <label class="course-checkbox">
          <input type="radio" name="semester-picker" id="semester-1" value="1">
          <span>1st Semester</span>
        </label>
        
        <label class="course-checkbox">
          <input type="radio" name="semester-picker" id="semester-2" value="2">
          <span>2nd Semester</span>
        </label>
      </div>
      
      <button id="apply-courses-btn" class="btn-primary">Apply Selection</button>
      <p id="selected-courses" class="selected-courses"></p>
      <button id="schedule-picker-btn" class="btn-primary" onclick="window.location.href='subjectschedule.html'" hidden>Go to Schedule Picker</button>
    </section>
  </main>

  <script src="../scripts/script.js"></script>
  <script src="../scripts/picker.js"></script>
</body>
</html>
