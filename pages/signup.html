<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Schedule Builder</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="page-shell">
    <div class="page-header">SIGN UP</div>

    <div class="login-card">
      <button class="close-btn" aria-label="Close signup form">×</button>
      <div class="card-content">
        <h1>Join Us!</h1>
        <p class="subtitle">Create your Academic Schedule Builder account</p>

        <div class="form-group">
          <label class="field">
            <span>Full Name</span>
            <input type="text" placeholder="Full Name" aria-label="Full name">
          </label>

          <label class="field">
            <span>Email</span>
            <input type="email" placeholder="Email" aria-label="Email address">
          </label>

          <label class="field">
            <span>Password</span>
            <input type="password" placeholder="Password" aria-label="Password">
          </label>

          <label class="field">
            <span>Confirm Password</span>
            <input type="password" placeholder="Confirm Password" aria-label="Confirm password">
          </label>
        </div>

        <button class="button primary signup-btn">Sign Up <span class="arrow">→</span></button>

        <div class="separator"><span>or</span></div>

        <button class="button social google">G Sign up with Google</button>
        <button class="button social facebook">f Sign up with Facebook</button>
        <button class="button social apple"> Sign up with Apple</button>

        <div class="footer-links">
          <p>Already have an account? <button class="link-button accent" id="login">Login</button></p>
        </div>
      </div>
    </div>
  </div>

  <script src="../scripts/script.js"></script>
</body>
</html>
