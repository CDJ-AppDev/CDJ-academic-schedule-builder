<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Schedule Builder</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="page-shell">
    <div class="page-header">LOGIN</div>

    <div class="login-card">
      <button class="close-btn" aria-label="Close login form">×</button>
      <div class="card-content">
        <h1>Welcome!</h1>
        <p class="subtitle">Login to Academic Schedule Builder</p>

        <div class="form-group">
          <label class="field">
            <span>Email</span>
            <input type="email" placeholder="Email" aria-label="Email address">
          </label>

          <label class="field">
            <span>Password</span>
            <input type="password" placeholder="Password" aria-label="Password">
          </label>
        </div>
        
        <div class="separator"></div>
        <button class="button primary login-btn">Login <span class="arrow">→</span></button>

        <div class="separator"></div>

        <div class="footer-links">
          <button class="link-button" id="forgot-password">Forgot your password?</button>
          <p>Don't have an account? <button class="link-button accent" id="signup">Sign Up</button></p>
        </div>
      </div>
    </div>
  </div>

  <script src="../scripts/auth.js"></script>
</body>
</html>
