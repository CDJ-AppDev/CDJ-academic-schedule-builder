<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Plotter</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-brand">
      <img src="../assets/logo.png" alt="Academic Schedule Builder" class="brand-icon">
      <span>Academic Schedule Builder</span>
    </div>

    <nav class="app-nav">
      <button class="nav-button" onclick="window.location.href='home.html'">Home</button>
      <button class="nav-button" onclick="window.location.href='coursepicker.html'">Course Picker</button>
      <button class="nav-button" onclick="window.location.href='subjectschedule.html'">Schedule Picker</button>
      <button class="nav-button" onclick="window.location.href='scheduleplotter.html'">Schedule Plotter</button>
    </nav>

    <button class="profile-button" aria-label="Login" onclick="window.location.href='../login.html'">👤</button>
  </header>

  <main class="page-content">
    <div class="page-title">
      <h1>Schedule Plotter</h1>
      <p>Visualize your weekly schedule and customize blocks.</p>
    </div>

    <section class="page-panel">
      <h2>Schedule Canvas</h2>
      <p>Plot your classes, labs, and study time using the toolbar above.</p>
    </section>
  </main>

  <script src="../scripts/script.js"></script>

</html>
