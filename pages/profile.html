<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Picker</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../frontend/css/main.css">
  <link rel="stylesheet" href="../frontend/css/profile.css">
</head>

<body>
  <header class="app-header">
    <div class="app-brand">
      <img src="../assets/logo.png" alt="Academic Schedule Builder" class="brand-icon">
      <span>Academic Schedule Builder</span>
    </div>

    <nav class="app-nav">
      <button class="nav-button" onclick="window.location.href='home.html'">Home</button>
      <button class="nav-button" onclick="window.location.href='profile.html'">Profile</button>
      <button class="nav-button" onclick="window.location.href='builder.html'">Schedule Picker</button>
      <button class="nav-button" onclick="window.location.href='plotter.html'">Schedule Plotter</button>
    </nav>

    <button class="close-btn close-btn-left" onclick="handleLogout('../index.html')">&times;</button>
  </header>

  <main class="page-content">
    <div class="page-title">
      <h1>Course Picker</h1>
      <p>Select courses and build your term schedule.</p>
    </div>

    <section class="page-panel">
      <div class="form-group-profile">
        <label class="field">
          <span>Select Track / Program</span>
          <select id="program-select" class="premium-select" aria-label="Select program">
            <option value="">-- Loading programs --</option>
          </select>
        </label>

        <label class="field">
          <span>Select Year Level</span>
          <select id="year-select" class="premium-select" aria-label="Select year level" disabled>
            <option value="">-- Select program first --</option>
          </select>
        </label>

        <label class="field">
          <span>Select Semester</span>
          <select id="semester-select" class="premium-select" aria-label="Select semester" disabled>
            <option value="">-- Select program first --</option>
          </select>
        </label>
      </div>

      <button id="apply-courses-btn" class="btn-primary">Apply Selection</button>
      <p id="selected-courses" class="selected-courses"></p>
      <button id="schedule-picker-btn" class="btn-primary" onclick="window.location.href='builder.html'" hidden>Go to
        Schedule Picker</button>
    </section>
  </main>
  <script src="../frontend/scripts/popup.js"></script>
  <script src="../frontend/scripts/auth.js"></script>
  <script src="../frontend/scripts/profile.js"></script>
</body>

</html>
