<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject Schedule</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <header class="app-header">
    <div class="app-brand">
      <img src="../assets/logo.png" alt="Academic Schedule Builder" class="brand-icon">
      <span>Academic Schedule Builder</span>
    </div>

    <nav class="app-nav">
      <button class="nav-button" onclick="window.location.href='home.html'">Home</button>
      <button class="nav-button" onclick="window.location.href='profile.html'">Profile</button>
      <button class="nav-button" onclick="window.location.href='builder.html'">Schedule Picker</button>
      <button class="nav-button" onclick="window.location.href='plotter.html'">Schedule Plotter</button>
    </nav>

    <button class="profile-button" aria-label="Login" onclick="window.location.href='../login.html'">👤</button>
  </header>

  <main class="page-content">
    <div class="page-title">
      <h1>Subject Schedules</h1>
      <p>Select sections and build your schedule.</p>
    </div>

    <section class="page-panel">
      <h2>Available Courses</h2>

      <div id="availableCourses" class="courses-list single-column"></div>

      <!-- dynamic courses loaded from API -->
      <script>
        // DB-rendered UI below will populate #availableCourses
      </script>

      <script>
        function toggleDropdown(dropdownId, arrowId) {
          const dropdown = document.getElementById(dropdownId);
          const arrow = document.getElementById(arrowId);

          if (dropdown.style.maxHeight === "0px" || dropdown.style.maxHeight === "") {
            dropdown.style.maxHeight = dropdown.scrollHeight + "px";
            arrow.style.transform = "rotate(180deg)";
          } else {
            dropdown.style.maxHeight = "0";
            arrow.style.transform = "rotate(0deg)";
          }
        }
      </script>

      <div class="course-card irregular-course">
        <div class="course-card-header irregular-header" onclick="toggleDropdown('irregularDropdown','irregularArrow')">
          <h3>Add Irregular Course</h3>
          <span class="arrow" id="irregularArrow">⌄</span>
        </div>

        <div class="course-card-body no-padding">
          <div class="dropdown" id="irregularDropdown">
            <div class="course-form">
              <div class="form-group">
                <label for="course-code">Course Code:</label>
                <input type="text" id="course-code" placeholder="e.g., CS101" required>
              </div>

              <div class="form-group">
                <label for="course-name">Course Name:</label>
                <input type="text" id="course-name" placeholder="e.g., Intro to Programming" required>
              </div>

              <div class="form-group">
                <label for="course-units">Units:</label>
                <input type="number" id="course-units" placeholder="e.g., 3" required>
              </div>

              <div class="form-group">
                <label for="teacher-name">Teacher Name:</label>
                <input type="text" id="teacher-name" placeholder="e.g., Prof. Garcia" required>
              </div>

              <div class="form-group">
                <label for="teacher-dept">Department:</label>
                <input type="text" id="teacher-dept" placeholder="e.g., Computer Science" required>
              </div>

              <div class="form-group">
                <label for="schedule-day">Day:</label>
                <select id="schedule-day" required>
                  <option value="">Select Day</option>
                  <option value="Monday">Monday</option>
                  <option value="Tuesday">Tuesday</option>
                  <option value="Wednesday">Wednesday</option>
                  <option value="Thursday">Thursday</option>
                  <option value="Friday">Friday</option>
                </select>
              </div>

              <div class="form-group">
                <label for="start-time">Start Time:</label>
                <input type="time" id="start-time" required>
              </div>

              <div class="form-group">
                <label for="end-time">End Time:</label>
                <input type="time" id="end-time" required>
              </div>

              <button id="add-course-btn" class="btn-primary" type="button">Add Course</button>
            </div>
          </div>
        </div>
      </div>

      <div class="spacer-20"></div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 style="margin: 0;">Schedules</h2>
        <select id="schedule-selector" style="padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; font-weight: bold; cursor: pointer;">
          <option value="new">+ Create New Schedule</option>
        </select>
      </div>
      <div class="courses-list single-column" id="scheduledList"></div>

      <div class="save-schedule-container">
        <div class="save-schedule-wrapper">
          Save Schedule as:
          <input type="text" id="schedule-name-input" class="save-input" value="">
          <span id="schedule-units-display" class="units-display">Units: 0 / 0</span>
          <span id="regular-status-badge" style="display: none; margin-left: 12px; font-weight: bold; font-size: 0.9rem; padding: 4px 8px; border-radius: 8px;"></span>
        </div>
        <button id="save-schedule-btn" class="btn-primary btn-save" type="button">SAVE</button>
      </div>
    </section>
  </main>

  <script src="../scripts/classes.js"></script>
  <script src="../scripts/subjects.js"></script>
</body>

</html>
