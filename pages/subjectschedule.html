<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject Schedule</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-brand">
      <img src="../assets/logo.png" alt="Brand" class="brand-icon">
      <span>MAIN</span>
    </div>

    <nav class="app-nav">
      <button class="nav-button" onclick="window.location.href='home.html'">Home</button>
      <button class="nav-button" onclick="window.location.href='coursepicker.html'">Course Picker</button>
      <button class="nav-button" onclick="window.location.href='subjectschedule.html'">Schedule Picker</button>
      <button class="nav-button" onclick="window.location.href='scheduleplotter.html'">Schedule Plotter</button>
    </nav>

    <button class="profile-button" aria-label="Open profile">👤</button>
  </header>

  <main class="page-content">
    <div class="page-title">
      <h1>Subject Schedule</h1>
      <p>Inspect your subject-by-subject timetable and plan ahead.</p>
    </div>

    <section class="page-panel">
      <h2>Available Courses</h2>
      <div id="available-courses" class="courses-list"></div>
    </section>

    <section class="page-panel">
      <h2>Add Course to Schedule</h2>
      
      <div class="course-form">
        <div class="form-group">
          <label for="course-code">Course Code:</label>
          <input type="text" id="course-code" placeholder="e.g., CS101" required>
        </div>
        
        <div class="form-group">
          <label for="course-name">Course Name:</label>
          <input type="text" id="course-name" placeholder="e.g., Intro to Programming" required>
        </div>
        
        <div class="form-group">
          <label for="teacher-name">Teacher Name:</label>
          <input type="text" id="teacher-name" placeholder="e.g., Prof. Garcia" required>
        </div>
        
        <div class="form-group">
          <label for="teacher-dept">Department:</label>
          <input type="text" id="teacher-dept" placeholder="e.g., Computer Science" required>
        </div>
        
        <div class="form-group">
          <label for="schedule-day">Day:</label>
          <select id="schedule-day" required>
            <option value="">Select Day</option>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="start-time">Start Time:</label>
          <input type="time" id="start-time" required>
        </div>
        
        <div class="form-group">
          <label for="end-time">End Time:</label>
          <input type="time" id="end-time" required>
        </div>
        
        <button id="add-course-btn" class="btn-primary">Add Course</button>
      </div>
    </section>

    <section class="page-panel">
      <h2>Scheduled Courses</h2>
      <div id="courses-list" class="courses-list"></div>
    </section>
  </main>

  <script src="../scripts/script.js"></script>
  <script src="../scripts/classes.js"></script>
  <script src="../scripts/courses.js"></script>
  <script src="../scripts/plotter.js"></script>
</body>
</html>
