<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Schedule Builder</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="./frontend/css/main.css">
  <link rel="stylesheet" href="./frontend/css/landing.css">
</head>

<body>
  <div class="page-shell">
    <div class="page-header">ACADEMIC SCHEDULE BUILDER</div>

    <div class="landing-container">
      <div class="landing-content">
        <h1 class="landing-title">Academic Schedule Builder</h1>
        <p class="subtitle landing-subtitle">Plan your courses and organize your academic semester with ease</p>
        <p class="description landing-desc">Get started building and visualizing your ideal academic
          schedule.</p>
      </div>

      <div class="landing-buttons">
        <button class="button primary" id="login-btn">Login</button>
        <button class="button secondary" id="signup-btn">Sign Up</button>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('login-btn').addEventListener('click', () => {
      window.location.href = './pages/login.html';
    });

    document.getElementById('signup-btn').addEventListener('click', () => {
      window.location.href = './pages/signup.html';
    });
  </script>
  <script src="./frontend/scripts/popup.js"></script>
</body>

</html>
